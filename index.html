<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador TikTok Pro</title>
    <style>
        body { background: #000; color: white; font-family: sans-serif; text-align: center; padding: 10px; }
        .container { max-width: 400px; margin: auto; }
        input { padding: 12px; width: 90%; border-radius: 8px; border: 1px solid #333; background: #111; color: white; margin-bottom: 10px; }
        button { padding: 12px; background: #00f2ea; border: none; font-weight: bold; border-radius: 8px; width: 95%; cursor: pointer; }
        button:disabled { background: #555; }
        
        #loader { display: none; margin: 20px 0; color: #00f2ea; font-weight: bold; }

        /* EL CONTENEDOR DEL VIDEO */
        .video-wrapper {
            display: none; /* Se oculta hasta que el video esté listo */
            margin: 20px auto;
            width: 280px; 
            height: 500px; 
            border: 3px solid #00f2ea;
            border-radius: 20px;
            overflow: hidden;
            background: #111;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .download-link { display: none; color: #00f2ea; text-decoration: none; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>TikTok Clip Maker</h1>
        <input type="text" id="urlInput" placeholder="Pega el link de YouTube aquí">
        <button id="btnCrear" onclick="enviarAlServidor()">CREAR CLIP VERTICAL</button>

        <div id="loader">⏳ Procesando en Termux...<br>Esto tarda unos 40 segundos.</div>

        <div id="videoWrapper" class="video-wrapper">
            <video id="reproductor" controls autoplay loop muted></video>
        </div>
        
        <a id="downloadBtn" class="download-link" download>⬇️ DESCARGAR PARA TIKTOK</a>
    </div>

    <script>
        async function enviarAlServidor() {
            const link = document.getElementById('urlInput').value;
            const btn = document.getElementById('btnCrear');
            const loader = document.getElementById('loader');
            const videoWrapper = document.getElementById('videoWrapper');
            const videoTag = document.getElementById('reproductor');
            const downloadBtn = document.getElementById('downloadBtn');

            if(!link) return alert("Pega un link primero");

            // Reset y mostrar cargando
            btn.disabled = true;
            loader.style.display = "block";
            videoWrapper.style.display = "none";
            downloadBtn.style.display = "none";

            try {
                const respuesta = await fetch('/generar-clips', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: link })
                });

                const data = await respuesta.json();

                if (data.success) {
                    // LA CLAVE: Recargar el source del video
                    videoTag.src = data.videoUrl;
                    videoTag.load(); // Forzar carga
                    
                    loader.style.display = "none";
                    videoWrapper.style.display = "block";
                    downloadBtn.href = data.videoUrl;
                    downloadBtn.style.display = "inline-block";
                } else {
                    alert("Error: " + data.error);
                }
            } catch (err) {
                alert("Error de conexión con Termux");
            } finally {
                btn.disabled = false;
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
